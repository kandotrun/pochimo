<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>表示</title>
  <link rel="stylesheet" href="/style.css?v=20260504-22" />
</head>
<body>
  <main class="app-shell with-tabs">
    <nav class="tab-nav" aria-label="メインナビゲーション">
      <a class="tab-link active" href="/viewer">表示</a>
      <a class="tab-link" href="/camera">撮影</a>
      <a class="tab-link" href="/settings">設定</a>
    </nav>

    <header class="hero pet-hero">
      <div class="pet-heading">
        <div id="petAvatar" class="pet-avatar">🐾</div>
        <div>
          <h1 id="pageTitle">今日の様子</h1>
          <p id="pageLead" class="lead">最新の写真と、ペットの一日を確認できます。</p>
        </div>
      </div>
    </header>

    <div class="date-nav" aria-label="日付切り替え">
      <button id="prevDayBtn" class="ghost icon-button" type="button" aria-label="前日">‹</button>
      <button id="dateDisplayBtn" class="date-display" type="button">今日</button>
      <button id="nextDayBtn" class="ghost icon-button" type="button" aria-label="翌日">›</button>
      <input id="dateInput" type="date" hidden />
    </div>

    <section class="card latest-card">
      <div class="section-head">
        <div>
          <h2 id="latestTitle">最新の写真</h2>
          <p id="latestMeta" class="section-description">まだ写真がありません。</p>
        </div>
      </div>
      <div class="latest-preview">
        <img id="latestImage" alt="最新の写真" hidden />
        <div id="latestOverlay" class="latest-overlay" hidden></div>
        <div id="latestEmpty" class="latest-empty">撮影が始まるとここに最新写真が表示されます。</div>
      </div>
    </section>

    <section class="card timeline-section">
      <div class="section-head">
        <div>
          <h2>今日の記録</h2>
        </div>
      </div>
      <div id="timeline" class="timeline empty">まだ記録がありません。</div>
    </section>

    <section class="card report-section">
      <div class="section-head">
        <div>
          <h2>ふりかえり</h2>
          <p class="section-description">毎日22時に自動で作成されます。</p>
        </div>
      </div>
      <div id="report" class="report-placeholder">22時になると、その日のふりかえりが表示されます。</div>
    </section>
  </main>
  <script src="/viewer.js?v=20260504-22"></script>
</body>
</html>
