<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>撮影</title>
  <link rel="stylesheet" href="/style.css?v=20260504-35" />
</head>
<body>
  <main class="app-shell camera-shell with-tabs">
    <nav class="tab-nav" aria-label="メインナビゲーション">
      <a class="tab-link" href="/viewer">表示</a>
      <a class="tab-link" href="/chat">チャット</a>
      <a class="tab-link active" href="/camera">撮影</a>
      <a class="tab-link" href="/settings">設定</a>
    </nav>

    <header class="hero simple-hero">
      <div>
        <h1>撮影</h1>
        <p class="lead">撮影を開始したら、画面をロックせず、このままにしてください。</p>
      </div>
    </header>

    <section class="camera-card">
      <div class="camera-frame">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas" hidden></canvas>
        <div class="camera-overlay">
          <span id="recordBadge" class="record-badge idle">停止中</span>
        </div>
      </div>

      <label class="field camera-name-field">このカメラの場所
        <input id="cameraLabel" type="text" placeholder="例: リビング / 玄関 / 寝室" autocomplete="off" />
      </label>
      <div class="control-panel">
        <button id="startBtn" class="primary">撮影開始</button>
        <button id="stopBtn" class="secondary" disabled>停止</button>
      </div>
      <p id="status" class="status">カメラ未開始</p>
      <p id="burstStatus" class="status subtle-status">動きが大きい時は自動で1秒バースト撮影します。</p>
    </section>

  </main>
  <script src="/camera.js?v=20260504-5"></script>
</body>
</html>
