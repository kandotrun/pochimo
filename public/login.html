<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ぽちも日報にログイン</title>
  <link rel="stylesheet" href="/style.css?v=20260504-25" />
</head>
<body>
  <main class="auth-shell">
    <section class="card auth-card">
      <div class="auth-icon">🐾</div>
      <h1 id="authTitle">ぽちも日報</h1>
      <p id="authLead" class="lead">メールに届く6桁コードでログインします。</p>

      <form id="authForm" class="auth-form">
        <label class="field">メールアドレス
          <input id="email" type="email" autocomplete="email" inputmode="email" placeholder="kan@example.com" required />
        </label>
        <label id="codeField" class="field auth-code-field" hidden aria-hidden="true">6桁コード
          <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="123456" />
        </label>
        <input id="inviteCode" type="hidden" />
        <button id="submitBtn" class="primary" type="submit">コードを送る</button>
        <button id="backBtn" class="ghost" type="button" hidden>メールアドレスを変更</button>
      </form>
      <p id="authStatus" class="status"></p>
    </section>
  </main>
  <script src="/login.js?v=20260504-2"></script>
</body>
</html>
